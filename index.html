<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テトリス</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>テトリス</h1>
        <div class="game-wrapper">
            <div class="game-info">
                <div class="info-box">
                    <h3>スコア</h3>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h3>レベル</h3>
                    <p id="level">1</p>
                </div>
                <div class="info-box">
                    <h3>ライン</h3>
                    <p id="lines">0</p>
                </div>
                <div class="info-box">
                    <h3>次のブロック</h3>
                    <canvas id="next-piece" width="100" height="100"></canvas>
                </div>
            </div>
            <div class="game-board">
                <canvas id="tetris" width="240" height="600"></canvas>
                <div id="game-over" class="hidden">
                    <h2>ゲームオーバー</h2>
                    <button id="restart-btn">もう一度プレイ</button>
                </div>
                <div id="start-screen">
                    <h2>テトリス</h2>
                    <button id="start-btn">スタート</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <h3>操作方法</h3>
            <p>← → : 左右移動</p>
            <p>↑ : 回転</p>
            <p>↓ : 高速落下</p>
            <p>Space : ハードドロップ</p>
            <p>P : 一時停止</p>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
